<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Essential tag telling Figmin XR to hook this webpage to its 3D environment -->
    <meta name="figmin">
    <title>Autonomous Stateful NPC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #00ffcc; font-size: 20px; }
        .status-box {
            background: #222;
            padding: 10px;
            border-radius: 8px;
            margin: 15px auto;
            width: 80%;
            border: 1px solid #333;
        }
        #state-display {
            font-weight: bold;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <h1>NPC Controller Panel</h1>
    <div class="status-box">
        Current NPC State: <span id="state-display">INITIALIZING...</span>
    </div>
    <p style="font-size: 12px; color: #aaa;">Keep this floating panel open in your room to run the NPC logic.</p>

    <script>
        // Ensure script runs only after Figmin XR XR-runtime connects
        document.addEventListener("FigminReady", init);

        // Define our Finite State Machine (FSM) States
        const States = {
            IDLE: "IDLE",
            WANDER: "WANDER"
        };

        let npcState = States.IDLE;
        let npcObject = null;
        let moveDirection =;
        let stateDisplay = null;

        function init() {
            stateDisplay = document.getElementById("state-display");
            updateUI("IDLE");

            // 1. Spawn a 3D Model into your room using the Figmin API
            // (Replaced with a default placeholder; swap URL later for your own GLB model)
            npcObject = figmin.createObject(figmin.ObjectType.MODEL3D);
            npcObject.model3d.url = "https://githubusercontent.com";
            
            // Place the NPC 2 meters in front of your starting headset position, 1 meter off the ground
            npcObject.transform.position = [0, 1.0, -2.0];

            // 2. Set up an automated FSM timer to change states every 3 seconds
            setInterval(processStateMachine, 3000);

            // 3. Start the continuous 60FPS physics/movement frame loop
            updateLoop();
        }

        // FSM Logic - Decisions happen here
        function processStateMachine() {
            if (!npcObject) return;

            // 50/50 Chance to switch between Idle and Wandering
            if (Math.random() > 0.5) {
                npcState = States.WANDER;
                updateUI("WANDER");
                
                // Pick a random X and Z direction on a horizontal plane (leaving Y flat)
                // Moves at a small fraction per frame
                let randomX = (Math.random() - 0.5) * 0.015;
                let randomZ = (Math.random() - 0.5) * 0.015;
                moveDirection = [randomX, 0, randomZ];
            } else {
                npcState = States.IDLE;
                updateUI("IDLE");
                moveDirection =;
            }
        }

        // Movement Frame Loop - Smooth frame updates happen here
        function updateLoop() {
            requestAnimationFrame(updateLoop);
            if (!npcObject) return;

            // If state is WANDER, incrementally add direction array to current transform array
            if (npcState === States.WANDER) {
                let currentPos = npcObject.transform.position;
                
                let newX = currentPos[0] + moveDirection[0];
                let newY = currentPos[1]; // Keeps floor height locked
                let newZ = currentPos[2] + moveDirection[2];

                // Simple safety bounds checking: Keep NPC within a 3-meter boundary from center
                if (Math.abs(newX) > 3.0) moveDirection[0] *= -1;
                if (Math.abs(newZ) > 3.0) moveDirection[2] *= -1;

                // Commit the new positional array back to Figmin's physical space
                npcObject.transform.position = [newX, newY, newZ];
            }
        }

        function updateUI(text) {
            if (stateDisplay) {
                stateDisplay.innerText = text;
                stateDisplay.style.color = (text === "WANDER") ? "#00ffcc" : "#ffcc00";
            }
        }
    </script>
</body>
</html>
